[workspace]
resolver = "3"
members = [
    "crates/koren-core",
    "crates/koren-protocol",
    "crates/koren-commands",
    "crates/koren-extensions",
    "crates/koren-lsp",
    "crates/koren-inspections",
    "crates/koren-lua",
    "crates/koren-workspace",
    "crates/koren-search",
    "crates/koren-git",
    "crates/koren-documents",
    "crates/koren-projects",
    "crates/koren-tasks",
    "crates/koren-cargo",
    "apps/koren-headless",
    "apps/koren-code",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/koren-idep/platform"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
mlua = { version = "=0.11.6", features = ["lua54", "vendored", "send"] }
glob = "0.3"
crossbeam-channel = "0.5"
# 0.4.33 requires Rust 1.88; 0.4.22 keeps the workspace's Rust 1.85 MSRV.
ignore = "=0.4.22"
regex = "1"
# Keep libgit2 bindings on the release that builds with the supported Rust 1.85 toolchain.
git2 = { version = "=0.20.2", default-features = false }
toml = "0.8"
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
koren-core = { path = "crates/koren-core" }
koren-protocol = { path = "crates/koren-protocol" }
koren-commands = { path = "crates/koren-commands" }
koren-extensions = { path = "crates/koren-extensions" }
koren-lsp = { path = "crates/koren-lsp" }
koren-inspections = { path = "crates/koren-inspections" }
koren-lua = { path = "crates/koren-lua" }
koren-workspace = { path = "crates/koren-workspace" }
koren-search = { path = "crates/koren-search" }
koren-git = { path = "crates/koren-git" }
koren-documents = { path = "crates/koren-documents" }
koren-projects = { path = "crates/koren-projects" }
koren-tasks = { path = "crates/koren-tasks" }
koren-cargo = { path = "crates/koren-cargo" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

