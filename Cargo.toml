[workspace]
resolver = "3"
members = [
    "crates/koren-core",
    "crates/koren-protocol",
    "crates/koren-commands",
    "crates/koren-workspace",
    "crates/koren-documents",
    "crates/koren-projects",
    "crates/koren-tasks",
    "crates/koren-cargo",
    "apps/koren-headless",
    "apps/koren-code",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/koren-idep/platform"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glob = "0.3"
toml = "0.8"
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
koren-core = { path = "crates/koren-core" }
koren-protocol = { path = "crates/koren-protocol" }
koren-commands = { path = "crates/koren-commands" }
koren-workspace = { path = "crates/koren-workspace" }
koren-documents = { path = "crates/koren-documents" }
koren-projects = { path = "crates/koren-projects" }
koren-tasks = { path = "crates/koren-tasks" }
koren-cargo = { path = "crates/koren-cargo" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

