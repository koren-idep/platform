name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Linux PR verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: apps/koren-code/frontend/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - name: Install desktop build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libgtk-3-dev libwebkit2gtk-4.1-dev xvfb xdotool openbox
      - name: Install Python test dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Run complete verification suite
        run: python3 scripts/pr_check.py
  platform:
    name: Cross-platform build and unit tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: apps/koren-code/frontend/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install Python test dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Install frontend dependencies
        run: npm ci --prefix apps/koren-code/frontend
      - name: Build and run platform tests
        run: cargo build --workspace --locked && cargo test --workspace --locked && python scripts/architecture.py && python -m pytest -q
  msrv:
    name: Rust 1.85 minimum supported version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: apps/koren-code/frontend/package-lock.json
      - name: Install Linux desktop build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libgtk-3-dev libwebkit2gtk-4.1-dev
      - uses: Swatinem/rust-cache@v2
      - name: Install frontend dependencies
        run: npm ci --prefix apps/koren-code/frontend
      - name: Build and test with MSRV
        run: cargo build --workspace --locked && cargo test --workspace --locked && cargo test --workspace --doc --locked
